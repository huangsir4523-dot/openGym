name: Deploy personal openGym to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Check personal data, backup and offline behavior
        run: npm test -- src/store/useStore.personal.test.jsx src/lib/api.personal.test.js src/lib/sw-media.test.js src/lib/sw-subpath.test.js src/lib/sw-offline-launch.test.js src/lib/sw-lazy.test.js src/lib/media-prefetch.test.js src/views/settings-pages.test.jsx src/store/useStore.import-restore.test.jsx src/store/useStore.media-backup.test.jsx src/store/useStore.quota.test.jsx src/lib/backup-media.test.js
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_PERSONAL: '1'
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
